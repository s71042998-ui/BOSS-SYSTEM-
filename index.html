<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BOSS SYSTEM</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:Arial,sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(520px,100%);background:#0b0b0b;border:1px solid #700;box-shadow:0 0 30px #300;padding:28px}
h1,h2{color:#e50914;margin-top:0}.small{color:#999;font-size:13px}
input{width:100%;padding:12px;margin:6px 0 12px;background:#111;color:#fff;border:1px solid #333;outline:0}
input:focus{border-color:#b00}.btn{border:1px solid #800;background:#180000;color:#fff;padding:10px 15px;margin:4px}
.btn:hover{background:#600}.error{color:#ff6666;min-height:20px}
header{padding:18px 24px;border-bottom:1px solid #400;display:flex;justify-content:space-between}
.dashboard{max-width:1100px;margin:auto;padding:24px}.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.module{min-height:115px;background:#0b0b0b;border:1px solid #400;padding:20px;color:#fff;text-align:left}.module:hover{border-color:#d00}
.module b{display:block;color:#e50914;margin-bottom:8px}.panel{margin-top:20px;padding:20px;background:#090909;border:1px solid #300}
.chatlog{height:280px;overflow:auto;background:#050505;border:1px solid #222;padding:10px}.msg{padding:8px 0;border-bottom:1px solid #181818}
.msg b{color:#e50914}.row{display:flex;gap:8px;margin-top:8px}.row input{margin:0}
.modal{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.modalbox{width:min(700px,100%);max-height:85vh;overflow:auto;background:#0b0b0b;border:1px solid #900;padding:22px}
@media(max-width:600px){header{flex-direction:column;gap:10px}.dashboard{padding:14px}}
</style>
</head>
<body>
<div id="welcome" class="screen">
 <div class="card"><h1>BOSS SYSTEM</h1><p class="small">Firebase-powered control system.</p>
  <button class="btn" onclick="showAuth('login')">LOGIN</button>
  <button class="btn" onclick="showAuth('signup')">SIGN UP</button>
 </div>
</div>

<div id="auth" class="screen hidden"><div class="card">
 <h2 id="authTitle">LOGIN</h2>
 <div id="signupFields" class="hidden">
  <label>Username</label><input id="username" maxlength="20" autocomplete="username">
  <label>Nickname</label><input id="nickname" maxlength="40">
 </div>
 <label>Email</label><input id="email" type="email" autocomplete="email">
 <label>Password</label><input id="password" type="password" autocomplete="current-password">
 <div id="confirmBox" class="hidden"><label>Confirm password</label><input id="confirmPassword" type="password"></div>
 <div id="authError" class="error"></div>
 <button class="btn" id="authBtn" onclick="submitAuth()">LOGIN</button>
 <button class="btn" onclick="showScreen('welcome')">BACK</button>
</div></div>

<div id="dashboard" class="hidden">
 <header><div><b style="color:#e50914">BOSS SYSTEM</b> <span id="identity" class="small"></span></div><button class="btn" onclick="logout()">LOGOUT</button></header>
 <main class="dashboard"><h2>CONTROL PANEL</h2><div id="modules" class="modules"></div><div id="panel" class="panel"><h2>Welcome</h2><p>Select a module.</p></div></main>
</div>

<div id="modal" class="modal hidden"><div class="modalbox"><div id="modalContent"></div><button class="btn" onclick="closeModal()">CLOSE</button></div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,deleteUser}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getFirestore,doc,getDoc,writeBatch,serverTimestamp,collection,addDoc,getDocs,deleteDoc,query,orderBy,onSnapshot,limit,where,updateDoc}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyC255XuKEt8JJKbWRjqLEqhxcOn1TXGC2U",
 authDomain:"boss-system-ddf6c.firebaseapp.com",
 projectId:"boss-system-ddf6c",
 storageBucket:"boss-system-ddf6c.firebasestorage.app",
 messagingSenderId:"67593000613",
 appId:"1:67593000613:web:b03c162be0e1661b171f4c",
 measurementId:"G-E6NGWHFJXH"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let mode="login",profile=null,stopChat=null;
const $=id=>document.getElementById(id);

window.showScreen=id=>{["welcome","auth"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden")};
window.showAuth=m=>{mode=m;showScreen("auth");$("authTitle").textContent=m==="login"?"LOGIN":"SIGN UP";$("authBtn").textContent=m==="login"?"LOGIN":"CREATE ACCOUNT";$("signupFields").classList.toggle("hidden",m!=="signup");$("confirmBox").classList.toggle("hidden",m!=="signup");$("authError").textContent=""};

window.submitAuth=async()=>{
 $("authError").textContent="";
 try{
  const email=$("email").value.trim(),password=$("password").value;
  if(!email||!password)throw Error("Enter your email and password.");
  if(mode==="signup"){
   const username=$("username").value.trim(),nickname=$("nickname").value.trim(),confirm=$("confirmPassword").value,lower=username.toLowerCase();
   if(!/^[A-Za-z0-9_]{3,20}$/.test(username))throw Error("Username must be 3-20 characters.");
   if(!nickname||nickname.length>40)throw Error("Nickname must be 1-40 characters.");
   if(password.length<6)throw Error("Password must be at least 6 characters.");
   if(password!==confirm)throw Error("Passwords do not match.");
   if(["maysi","santa","bossmaysi","boss_maysi"].includes(lower))throw Error("That username is reserved.");
   const r=doc(db,"usernames",lower),old=await getDoc(r);
   if(old.exists())throw Error("That username is already taken.");
   const c=await createUserWithEmailAndPassword(auth,email,password);
   try{
    const b=writeBatch(db);
    b.set(doc(db,"users",c.user.uid),{uid:c.user.uid,username,nickname,usernameLower:lower,role:"USER",createdAt:serverTimestamp()});
    b.set(r,{uid:c.user.uid,username,usernameLower:lower,createdAt:serverTimestamp()});
    await b.commit();
   }catch(e){try{await deleteUser(c.user)}catch(_){}throw Error("Account profile setup failed. Please try again.")}
  }else await signInWithEmailAndPassword(auth,email,password);
 }catch(e){$("authError").textContent=nice(e)}
};

function nice(e){
 const c=e?.code||"";
 if(c.includes("invalid-credential"))return"Invalid email or password.";
 if(c.includes("email-already-in-use"))return"Email already registered.";
 if(c.includes("invalid-email"))return"Enter a valid email.";
 if(c.includes("weak-password"))return"Password is too weak.";
 if(c.includes("permission-denied"))return"Firebase permission denied. Check Firestore Rules.";
 return e?.message||"Something went wrong.";
}

onAuthStateChanged(auth,async user=>{
 if(!user){profile=null;$("dashboard").classList.add("hidden");showScreen("welcome");return}
 try{
  const s=await getDoc(doc(db,"users",user.uid));
  if(!s.exists()){await signOut(auth);throw Error("Profile not found.")}
  profile=s.data();enterDashboard();
 }catch(e){$("authError").textContent=nice(e);await signOut(auth)}
});

function enterDashboard(){
 $("welcome").classList.add("hidden");$("auth").classList.add("hidden");$("dashboard").classList.remove("hidden");
 $("identity").textContent=`${profile.nickname} · ${profile.role}`;renderModules();
}

function renderModules(){
 const a=[["Library","Personal Firebase notes.","library"],["Storage","Local browser storage.","storage"],["Games","Games room.","games"],["Riddles","Riddle room.","riddles"],["Quiz","Quiz room.","quiz"],["Links","Save useful links.","links"],["Chat","Shared chat.","chat"],["SANTA","Restricted console.","santa"]];
 $("modules").innerHTML=a.map(x=>`<button class="module" onclick="openModule('${x[2]}')"><b>${x[0]}</b><span class="small">${x[1]}</span></button>`).join("");
}

window.openModule=async key=>{
 const p=$("panel");
 if(key==="library"){p.innerHTML='<h2>LIBRARY</h2><input id="noteTitle" placeholder="Note title"><input id="noteBody" placeholder="Note body"><button class="btn" onclick="saveNote()">SAVE NOTE</button><div id="notesList"></div>';await loadNotes()}
 if(key==="storage")p.innerHTML='<h2>STORAGE</h2><p>Small browser-local data only. Cloud file uploads are not enabled.</p><button class="btn" onclick="localStorage.setItem(\'boss_demo\',\'Saved\')">SAVE TEST</button><button class="btn" onclick="alert(localStorage.getItem(\'boss_demo\')||\'Nothing saved\')">READ TEST</button>';
 if(key==="games")p.innerHTML='<h2>GAMES</h2><button class="btn" onclick="memoryGame()">CAT MEMORY ARENA</button>';
 if(key==="riddles")p.innerHTML='<h2>RIDDLES</h2><p>Riddle room ready for the next build.</p>';
 if(key==="quiz")p.innerHTML='<h2>QUIZ</h2><p>Quiz room ready for the next build.</p>';
 if(key==="links"){p.innerHTML='<h2>LINKS</h2><input id="linkLabel" placeholder="Label"><input id="linkUrl" placeholder="https://example.com"><button class="btn" onclick="saveLink()">SAVE LINK</button><div id="linksList"></div>';await loadLinks()}
 if(key==="chat"){p.innerHTML='<h2>CHAT</h2><div id="chatLog" class="chatlog">Loading...</div><div class="row"><input id="chatInput" maxlength="1000" placeholder="Message"><button class="btn" onclick="sendChat()">SEND</button></div>';startChat()}
 if(key==="santa"){if(!["BOSS","SANTA"].includes(profile.role)){p.innerHTML="<h2>SANTA</h2><p>Access denied.</p>";return}p.innerHTML=`<h2>SANTA COMMAND CONSOLE</h2><p>Authority: <b>${profile.role}</b></p><button class="btn" onclick="showReports()">VIEW REPORTS</button>`}
};

window.saveNote=async()=>{try{const title=$("noteTitle").value.trim(),body=$("noteBody").value.trim();if(!title||!body)return alert("Enter title and body.");await addDoc(collection(db,"users",auth.currentUser.uid,"notes"),{title,body,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});loadNotes()}catch(e){alert(nice(e))}};
async function loadNotes(){const s=await getDocs(collection(db,"users",auth.currentUser.uid,"notes"));$("notesList").innerHTML=s.docs.map(d=>{const n=d.data();return`<div class="panel"><b>${esc(n.title)}</b><p>${esc(n.body)}</p><button class="btn" onclick="deleteNote('${d.id}')">DELETE</button></div>`}).join("")||"<p class='small'>No notes yet.</p>"}
window.deleteNote=async id=>{await deleteDoc(doc(db,"users",auth.currentUser.uid,"notes",id));loadNotes()};

window.saveLink=async()=>{try{const label=$("linkLabel").value.trim(),url=$("linkUrl").value.trim();if(!label||!/^https?:\/\//i.test(url))return alert("Enter a valid http/https URL.");await addDoc(collection(db,"users",auth.currentUser.uid,"links"),{label,url,createdAt:serverTimestamp()});loadLinks()}catch(e){alert(nice(e))}};
async function loadLinks(){const s=await getDocs(collection(db,"users",auth.currentUser.uid,"links"));$("linksList").innerHTML=s.docs.map(d=>{const l=d.data();return`<div class="panel"><b>${esc(l.label)}</b><br><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a><br><button class="btn" onclick="deleteLink('${d.id}')">DELETE</button></div>`}).join("")||"<p class='small'>No links yet.</p>"}
window.deleteLink=async id=>{await deleteDoc(doc(db,"users",auth.currentUser.uid,"links",id));loadLinks()};

function startChat(){
 if(stopChat)stopChat();
 const q=query(collection(db,"chatMessages"),orderBy("createdAt","asc"),limit(100));
 stopChat=onSnapshot(q,s=>{$("chatLog").innerHTML=s.docs.map(d=>{const m=d.data();return`<div class="msg"><b>${esc(m.nickname||m.username)}</b>: ${esc(m.text)} <button class="btn" onclick="report('${d.id}','${esc(m.uid)}','${esc(m.nickname||m.username)}')">REPORT</button></div>`}).join("")||"No messages yet.";$("chatLog").scrollTop=$("chatLog").scrollHeight});
}
window.sendChat=async()=>{const text=$("chatInput").value.trim();if(!text)return;try{await addDoc(collection(db,"chatMessages"),{uid:auth.currentUser.uid,username:profile.username,nickname:profile.nickname,text,createdAt:serverTimestamp()});$("chatInput").value=""}catch(e){alert(nice(e))}};
window.report=async(id,uid,name)=>{const reason=prompt("Reason for report?");if(!reason)return;try{await addDoc(collection(db,"reports"),{messageId:id,reportedUid:uid,reportedName:name,reporterUid:auth.currentUser.uid,reason:reason.slice(0,500),status:"open",createdAt:serverTimestamp()});alert("Report submitted.")}catch(e){alert(nice(e))}};

window.showReports=async()=>{
 const s=await getDocs(query(collection(db,"reports"),where("status","==","open"),limit(50)));
 $("panel").innerHTML="<h2>OPEN REPORTS</h2>"+(s.docs.map(d=>{const r=d.data();return`<div class="panel"><b>${esc(r.reportedName||"Unknown")}</b><p>${esc(r.reason)}</p><button class="btn" onclick="review('${d.id}')">MARK REVIEWED</button></div>`}).join("")||"<p>No open reports.</p>");
};
window.review=async id=>{await updateDoc(doc(db,"reports",id),{status:"reviewed",reviewedBy:auth.currentUser.uid,reviewedAt:serverTimestamp()});showReports()};

window.memoryGame=()=>{
 const a=["🐱","🐱","🐶","🐶","🦊","🦊","🐼","🐼"].sort(()=>Math.random()-.5);
 $("modalContent").innerHTML="<h2>CAT MEMORY ARENA</h2><div id='grid' style='display:grid;grid-template-columns:repeat(4,1fr);gap:8px'></div>";
 $("modal").classList.remove("hidden");let first=null,lock=false,done=0;
 a.forEach(x=>{const b=document.createElement("button");b.className="btn";b.style.height="70px";b.textContent="❓";b.onclick=()=>{if(lock||b.dataset.done)return;b.textContent=x;if(!first){first={b,x};return}if(first.x===x){first.b.dataset.done="1";b.dataset.done="1";first=null;done+=2;if(done===a.length)alert("You cleared the arena!")}else{lock=true;const old=first.b;first=null;setTimeout(()=>{old.textContent="❓";b.textContent="❓";lock=false},600)}};$("grid").appendChild(b)})
};
window.closeModal=()=>$("modal").classList.add("hidden");
window.logout=async()=>{if(stopChat)stopChat();await signOut(auth)};
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script>
</body>
</html>
