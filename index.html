<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BOSS SYSTEM</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:Arial,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(560px,100%);background:#0b0b0b;border:1px solid #700;box-shadow:0 0 30px #300;padding:28px}
h1,h2{color:#e50914;margin-top:0}.small{color:#999;font-size:13px}
input,textarea,select{width:100%;padding:12px;margin:6px 0 12px;background:#111;color:#fff;border:1px solid #333;outline:0}
textarea{min-height:100px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#b00}.btn{border:1px solid #800;background:#180000;color:#fff;padding:10px 15px;margin:4px}
.btn:hover{background:#600}.error{color:#ff6666;min-height:20px}.ok{color:#7dff7d}
header{padding:18px 24px;border-bottom:1px solid #400;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dashboard{max-width:1150px;margin:auto;padding:24px}.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.module{min-height:115px;background:#0b0b0b;border:1px solid #400;padding:20px;color:#fff;text-align:left}.module:hover{border-color:#d00}
.module b{display:block;color:#e50914;margin-bottom:8px}.panel{margin-top:20px;padding:20px;background:#090909;border:1px solid #300}
.chatlog{height:300px;overflow:auto;background:#050505;border:1px solid #222;padding:10px}.msg{padding:10px 0;border-bottom:1px solid #181818}
.msg b{color:#e50914}.row{display:flex;gap:8px;margin-top:8px}.row input{margin:0}.row .btn{white-space:nowrap}
.modal{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.modalbox{width:min(780px,100%);max-height:90vh;overflow:auto;background:#0b0b0b;border:1px solid #900;padding:22px}
.badge{display:inline-block;padding:5px 9px;border:1px solid #555;font-size:11px;color:#bbb}.admin{border-color:#900;color:#ff5555}
.item{padding:12px;margin:8px 0;background:#0d0d0d;border:1px solid #222}.danger{border-color:#700}.success{border-color:#174d17}
pre{white-space:pre-wrap;word-break:break-word;color:#bbb}.countdown{font-family:monospace;color:#e50914;font-size:20px}
.progress{height:6px;background:#222;margin:10px 0}.progress>div{height:100%;background:#900;width:0}
@media(max-width:600px){header{flex-direction:column;align-items:flex-start}.dashboard{padding:14px}.row{flex-direction:column}}
</style>
</head>
<body>

<div id="welcome" class="screen">
 <div class="card">
  <h1>BOSS SYSTEM</h1>
  <p class="small">Firebase-powered control system.</p>
  <button class="btn" onclick="showAuth('login')">LOGIN</button>
  <button class="btn" onclick="showAuth('signup')">SIGN UP</button>
 </div>
</div>

<div id="auth" class="screen hidden"><div class="card">
 <h2 id="authTitle">LOGIN</h2>
 <div id="signupFields" class="hidden">
  <label>Username</label><input id="username" maxlength="20" autocomplete="username">
  <label>Nickname</label><input id="nickname" maxlength="40">
 </div>
 <label>Email</label><input id="email" type="email" autocomplete="email">
 <label>Password</label><input id="password" type="password" autocomplete="current-password">
 <div id="confirmBox" class="hidden"><label>Confirm password</label><input id="confirmPassword" type="password"></div>
 <div id="authError" class="error"></div>
 <button class="btn" id="authBtn" onclick="submitAuth()">LOGIN</button>
 <button class="btn" onclick="showScreen('welcome')">BACK</button>
</div></div>

<div id="dashboard" class="hidden">
 <header>
  <div><b style="color:#e50914">BOSS SYSTEM</b> <span id="identity" class="small"></span></div>
  <div><button class="btn" onclick="openProfile()">PROFILE</button><button class="btn" onclick="logout()">LOGOUT</button></div>
 </header>
 <main class="dashboard">
  <h2>CONTROL PANEL</h2>
  <div id="birthdayBanner" class="panel hidden"></div>
  <div id="modules" class="modules"></div>
  <div id="panel" class="panel"><h2>Welcome</h2><p>Select a module.</p></div>
 </main>
</div>

<div id="modal" class="modal hidden"><div class="modalbox"><div id="modalContent"></div><button class="btn" onclick="closeModal()">CLOSE</button></div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,deleteUser,updatePassword}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getFirestore,doc,getDoc,writeBatch,serverTimestamp,collection,addDoc,getDocs,deleteDoc,query,orderBy,onSnapshot,limit,where,updateDoc}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyC255XuKEt8JJKbWRjqLEqhxcOn1TXGC2U",
 authDomain:"boss-system-ddf6c.firebaseapp.com",
 projectId:"boss-system-ddf6c",
 storageBucket:"boss-system-ddf6c.firebasestorage.app",
 messagingSenderId:"67593000613",
 appId:"1:67593000613:web:b03c162be0e1661b171f4c",
 measurementId:"G-E6NGWHFJXH"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let mode="login",profile=null,stopChat=null,transferCleanup=[];
const $=id=>document.getElementById(id);
const ADMIN_ROLES=["BOSS","SANTA"];

window.showScreen=id=>{["welcome","auth"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden")};
window.showAuth=m=>{mode=m;showScreen("auth");$("authTitle").textContent=m==="login"?"LOGIN":"SIGN UP";$("authBtn").textContent=m==="login"?"LOGIN":"CREATE ACCOUNT";$("signupFields").classList.toggle("hidden",m!=="signup");$("confirmBox").classList.toggle("hidden",m!=="signup");$("authError").textContent=""};

window.submitAuth=async()=>{
 $("authError").textContent="";
 try{
  const email=$("email").value.trim(),password=$("password").value;
  if(!email||!password)throw Error("Enter your email and password.");
  if(mode==="signup"){
   const username=$("username").value.trim(),nickname=$("nickname").value.trim(),confirm=$("confirmPassword").value,lower=username.toLowerCase();
   if(!/^[A-Za-z0-9_]{3,20}$/.test(username))throw Error("Username must be 3-20 characters.");
   if(!nickname||nickname.length>40)throw Error("Nickname must be 1-40 characters.");
   if(password.length<6)throw Error("Password must be at least 6 characters.");
   if(password!==confirm)throw Error("Passwords do not match.");
   if(["maysi","santa","bossmaysi","boss_maysi"].includes(lower))throw Error("That username is reserved.");
   const r=doc(db,"usernames",lower),old=await getDoc(r);
   if(old.exists())throw Error("That username is already taken.");
   const c=await createUserWithEmailAndPassword(auth,email,password);
   try{
    const b=writeBatch(db);
    b.set(doc(db,"users",c.user.uid),{uid:c.user.uid,username,nickname,usernameLower:lower,role:"USER",suspended:false,createdAt:serverTimestamp()});
    b.set(r,{uid:c.user.uid,username,usernameLower:lower,createdAt:serverTimestamp()});
    await b.commit();
   }catch(e){try{await deleteUser(c.user)}catch(_){}throw Error("Account profile setup failed. Check Firestore Rules.")}
  }else await signInWithEmailAndPassword(auth,email,password);
 }catch(e){$("authError").textContent=nice(e)}
};

function nice(e){
 const c=e?.code||"";
 if(c.includes("invalid-credential"))return"Invalid email or password.";
 if(c.includes("email-already-in-use"))return"Email already registered.";
 if(c.includes("invalid-email"))return"Enter a valid email.";
 if(c.includes("weak-password"))return"Password is too weak.";
 if(c.includes("permission-denied"))return"Firebase permission denied. Check Firestore Rules.";
 return e?.message||"Something went wrong.";
}

onAuthStateChanged(auth,async user=>{
 if(!user){profile=null;$("dashboard").classList.add("hidden");showScreen("welcome");return}
 try{
  const s=await getDoc(doc(db,"users",user.uid));
  if(!s.exists()){await signOut(auth);throw Error("Profile not found.")}
  profile=s.data();
  if(profile.suspended){await signOut(auth);throw Error("This account is suspended.")}
  enterDashboard();
 }catch(e){$("authError").textContent=nice(e);await signOut(auth)}
});

function enterDashboard(){
 $("welcome").classList.add("hidden");$("auth").classList.add("hidden");$("dashboard").classList.remove("hidden");
 $("identity").innerHTML=`${esc(profile.nickname)} · <span class="badge ${ADMIN_ROLES.includes(profile.role)?"admin":""}">${esc(profile.role)}</span>`;
 renderModules();birthdayReveal();
}

function isAdmin(){return ADMIN_ROLES.includes(profile?.role)}

function renderModules(){
 const a=[
 ["Library","Personal Firebase notes.","library"],
 ["Storage","Local browser files.","storage"],
 ["Games","Games room.","games"],
 ["Riddles","Riddle room.","riddles"],
 ["Quiz","Quiz room.","quiz"],
 ["Links","Save useful links.","links"],
 ["Chat","Shared moderated chat.","chat"],
 ["SANTA","Assistant / admin console.","santa"]
 ];
 if(isAdmin())a.push(["ADMIN","Moderation and users.","admin"]);
 $("modules").innerHTML=a.map(x=>`<button class="module" onclick="openModule('${x[2]}')"><b>${x[0]}</b><span class="small">${x[1]}</span></button>`).join("");
}

function birthdayReveal(){
 const now=new Date(),month=now.getMonth()+1,day=now.getDate();
 const banner=$("birthdayBanner");
 if(month===11&&day===17){
  banner.classList.remove("hidden");
  banner.innerHTML="<h2>🎂 BOSS MAYSI BIRTHDAY PROTOCOL</h2><p>Automatic birthday reveal is active today.</p>";
 }else{
  banner.classList.add("hidden");
 }
}

window.openModule=async key=>{
 const p=$("panel");
 if(stopChat) {stopChat();stopChat=null}
 if(key==="library"){p.innerHTML='<h2>LIBRARY</h2><input id="noteTitle" placeholder="Note title"><textarea id="noteBody" placeholder="Note body"></textarea><button class="btn" onclick="saveNote()">SAVE NOTE</button><div id="notesList"></div>';await loadNotes()}
 if(key==="storage"){await renderStorage()}
 if(key==="games")p.innerHTML='<h2>GAMES</h2><button class="btn" onclick="memoryGame()">CAT MEMORY ARENA</button>';
 if(key==="riddles")p.innerHTML='<h2>RIDDLES</h2><p>Riddle room ready.</p><button class="btn" onclick="newRiddle()">NEW RIDDLE</button><div id="riddleOut"></div>';
 if(key==="quiz")p.innerHTML='<h2>QUIZ</h2><p>Quiz room ready.</p><button class="btn" onclick="quiz()">START QUIZ</button><div id="quizOut"></div>';
 if(key==="links"){p.innerHTML='<h2>LINKS</h2><input id="linkLabel" placeholder="Label"><input id="linkUrl" placeholder="https://example.com"><button class="btn" onclick="saveLink()">SAVE LINK</button><div id="linksList"></div>';await loadLinks()}
 if(key==="chat"){p.innerHTML='<h2>CHAT</h2><div id="chatLog" class="chatlog">Loading...</div><div class="row"><input id="chatInput" maxlength="1000" placeholder="Message"><button class="btn" onclick="sendChat()">SEND</button></div>';startChat()}
 if(key==="santa")renderSanta(p);
 if(key==="admin"){if(!isAdmin()){p.innerHTML="<h2>ACCESS DENIED</h2>";return}renderAdmin(p)}
};

async function loadNotes(){
 const s=await getDocs(collection(db,"users",auth.currentUser.uid,"notes"));
 $("notesList").innerHTML=s.docs.map(d=>{const n=d.data();return`<div class="item"><b>${esc(n.title)}</b><p>${esc(n.body)}</p><button class="btn" onclick="deleteNote('${d.id}')">DELETE</button></div>`}).join("")||"<p class='small'>No notes yet.</p>"
}
window.saveNote=async()=>{try{const title=$("noteTitle").value.trim(),body=$("noteBody").value.trim();if(!title||!body)return alert("Enter title and body.");await addDoc(collection(db,"users",auth.currentUser.uid,"notes"),{title,body,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});loadNotes()}catch(e){alert(nice(e))}};
window.deleteNote=async id=>{try{await deleteDoc(doc(db,"users",auth.currentUser.uid,"notes",id));loadNotes()}catch(e){alert(nice(e))}};

async function loadLinks(){
 const s=await getDocs(collection(db,"users",auth.currentUser.uid,"links"));
 $("linksList").innerHTML=s.docs.map(d=>{const l=d.data();return`<div class="item"><b>${esc(l.label)}</b><br><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a><br><button class="btn" onclick="deleteLink('${d.id}')">DELETE</button></div>`}).join("")||"<p class='small'>No links yet.</p>"
}
window.saveLink=async()=>{try{const label=$("linkLabel").value.trim(),url=$("linkUrl").value.trim();if(!label||!/^https?:\/\//i.test(url))return alert("Enter a valid http/https URL.");await addDoc(collection(db,"users",auth.currentUser.uid,"links"),{label,url,createdAt:serverTimestamp()});loadLinks()}catch(e){alert(nice(e))}};
window.deleteLink=async id=>{try{await deleteDoc(doc(db,"users",auth.currentUser.uid,"links",id));loadLinks()}catch(e){alert(nice(e))}};

async function renderStorage(){
 $("panel").innerHTML=`<h2>LOCAL STORAGE</h2>
 <p class="small">Files stay on this device. They are not uploaded to Firebase.</p>
 <input id="filePicker" type="file">
 <button class="btn" onclick="saveLocalFile()">SAVE FILE LOCALLY</button>
 <button class="btn" onclick="listLocalFiles()">REFRESH</button>
 <div id="localFiles"></div>
 <hr style="border-color:#222">
 <h3>PEER-TO-PEER TRANSFER</h3>
 <p class="small">Send a selected local file directly to another signed-in user. Firebase stores only transfer signalling, not the file bytes.</p>
 <input id="recipientUsername" placeholder="Recipient username">
 <button class="btn" onclick="startTransfer()">SEND SELECTED FILE</button>
 <div id="transferStatus" class="small"></div>
 <div id="incomingTransfers"></div>`;
 await listLocalFiles();watchIncomingTransfers();
}

function localKey(){return"boss_local_files_"+auth.currentUser.uid}
function readLocal(){try{return JSON.parse(localStorage.getItem(localKey())||"[]")}catch(_){return[]}}
async function saveLocalFile(){
 const f=$("filePicker")?.files?.[0];if(!f)return alert("Choose a file first.");
 if(f.size>8*1024*1024)return alert("Local browser storage limit for this feature is 8 MB per file.");
 const reader=new FileReader();reader.onload=()=>{const a=readLocal();a.push({id:crypto.randomUUID(),name:f.name,type:f.type,size:f.size,data:reader.result,savedAt:new Date().toISOString()});localStorage.setItem(localKey(),JSON.stringify(a));listLocalFiles()};reader.readAsDataURL(f)
}
async function listLocalFiles(){
 const box=$("localFiles");if(!box)return;const a=readLocal();
 box.innerHTML=a.map(x=>`<div class="item"><b>${esc(x.name)}</b><div class="small">${Math.round(x.size/1024)} KB</div><a class="btn" href="${x.data}" download="${esc(x.name)}">DOWNLOAD</a><button class="btn" onclick="deleteLocalFile('${x.id}')">DELETE</button></div>`).join("")||"<p class='small'>No local files saved.</p>"
}
window.deleteLocalFile=id=>{localStorage.setItem(localKey(),JSON.stringify(readLocal().filter(x=>x.id!==id)));listLocalFiles()}

async function startTransfer(){
 const file=$("filePicker")?.files?.[0],uname=$("recipientUsername").value.trim().toLowerCase(),status=$("transferStatus");
 if(!file)return alert("Choose a file first.");
 if(file.size>25*1024*1024)return alert("Maximum transfer size is 25 MB.");
 if(!uname)return alert("Enter recipient username.");
 status.textContent="Finding recipient...";
 const us=await getDoc(doc(db,"usernames",uname));if(!us.exists())return status.textContent="Recipient not found.";
 const recipientUid=us.data().uid;if(recipientUid===auth.currentUser.uid)return status.textContent="You cannot send to yourself.";
 status.textContent="Preparing peer connection...";
 const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
 const channel=pc.createDataChannel("file");
 const offer=await pc.createOffer();await pc.setLocalDescription(offer);await waitIce(pc);
 const transfer=await addDoc(collection(db,"transfers"),{senderUid:auth.currentUser.uid,senderName:profile.nickname,recipientUid,status:"offered",offer:JSON.stringify(pc.localDescription),fileName:file.name,fileSize:file.size,createdAt:serverTimestamp()});
 status.textContent="Offer sent. Waiting for recipient...";
 const unsub=onSnapshot(doc(db,"transfers",transfer.id),async snap=>{
  if(!snap.exists())return;
  const d=snap.data();
  if(d.status==="accepted"&&d.answer&&!pc.currentRemoteDescription){
   await pc.setRemoteDescription(JSON.parse(d.answer));status.textContent="Connected. Sending...";
  }
  if(d.status==="rejected"){status.textContent="Transfer rejected.";unsub();pc.close()}
 });
 channel.onopen=async()=>{
  const buf=await file.arrayBuffer(),chunk=16*1024;let sent=0;
  channel.send(JSON.stringify({type:"meta",name:file.name,size:file.size,mime:file.type}));
  for(let i=0;i<buf.byteLength;i+=chunk){while(channel.bufferedAmount>1024*1024)await new Promise(r=>setTimeout(r,20));channel.send(buf.slice(i,Math.min(i+chunk,buf.byteLength)));sent=Math.min(i+chunk,buf.byteLength);status.textContent=`Sending ${Math.round(sent/file.size*100)}%`}
  channel.send(JSON.stringify({type:"done"}));status.textContent="Transfer complete.";unsub();pc.close();
 };
}
function waitIce(pc){return new Promise(resolve=>{if(pc.iceGatheringState==="complete")return resolve();const t=setTimeout(resolve,5000);pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState==="complete"){clearTimeout(t);resolve()}}})}

function watchIncomingTransfers(){
 transferCleanup.forEach(x=>x());transferCleanup=[];
 const q=query(collection(db,"transfers"),where("recipientUid","==",auth.currentUser.uid),where("status","==","offered"),limit(10));
 transferCleanup.push(onSnapshot(q,s=>{
  const box=$("incomingTransfers");if(!box)return;
  box.innerHTML=s.docs.map(d=>{const x=d.data();return`<div class="item"><b>Incoming file: ${esc(x.fileName)}</b><p class="small">From ${esc(x.senderName||"unknown")} · ${Math.round(x.fileSize/1024)} KB</p><button class="btn" onclick="acceptTransfer('${d.id}')">ACCEPT</button><button class="btn" onclick="rejectTransfer('${d.id}')">REJECT</button></div>`}).join("");
 }))
}
window.rejectTransfer=async id=>updateDoc(doc(db,"transfers",id),{status:"rejected",answer:""});
window.acceptTransfer=async id=>{
 const snap=await getDoc(doc(db,"transfers",id));if(!snap.exists())return;const d=snap.data();
 const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});let meta=null,chunks=[],received=0;
 pc.ondatachannel=e=>{const ch=e.channel;ch.binaryType="arraybuffer";ch.onmessage=ev=>{if(typeof ev.data==="string"){const x=JSON.parse(ev.data);if(x.type==="meta"){meta=x;chunks=[];received=0}if(x.type==="done"){const blob=new Blob(chunks,{type:meta?.mime||"application/octet-stream"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=meta?.name||"received-file";a.click();$("transferStatus").textContent="Received file: "+(meta?.name||"file");}}else{chunks.push(ev.data);received+=ev.data.byteLength;if(meta)$("transferStatus").textContent=`Receiving ${Math.round(received/meta.size*100)}%`}}};
 await pc.setRemoteDescription(JSON.parse(d.offer));const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await waitIce(pc);
 await updateDoc(doc(db,"transfers",id),{status:"accepted",answer:JSON.stringify(pc.localDescription)});
}

function startChat(){
 const q=query(collection(db,"chatMessages"),orderBy("createdAt","asc"),limit(100));
 stopChat=onSnapshot(q,s=>{$("chatLog").innerHTML=s.docs.map(d=>{const m=d.data();return`<div class="msg"><b>${esc(m.nickname||m.username)}</b>: ${esc(m.text)} <button class="btn" onclick="report('${d.id}','${esc(m.uid)}','${esc(m.nickname||m.username)}')">REPORT</button>${isAdmin()?` <button class="btn" onclick="deleteMessage('${d.id}')">DELETE</button>`:""}</div>`}).join("")||"No messages yet.";$("chatLog").scrollTop=$("chatLog").scrollHeight});
}
window.sendChat=async()=>{const text=$("chatInput").value.trim();if(!text)return;try{if(text.length>1000)return;await addDoc(collection(db,"chatMessages"),{uid:auth.currentUser.uid,username:profile.username,nickname:profile.nickname,text,createdAt:serverTimestamp()});$("chatInput").value=""}catch(e){alert(nice(e))}};
window.deleteMessage=async id=>{if(!isAdmin())return;try{await deleteDoc(doc(db,"chatMessages",id))}catch(e){alert(nice(e))}};
window.report=async(id,uid,name)=>{const reason=prompt("Reason for report?");if(!reason)return;try{await addDoc(collection(db,"reports"),{messageId:id,reportedUid:uid,reportedName:name,reporterUid:auth.currentUser.uid,reason:reason.slice(0,500),status:"open",createdAt:serverTimestamp()});alert("Report submitted.")}catch(e){alert(nice(e))}};

function renderSanta(p){
 if(!isAdmin()){p.innerHTML="<h2>SANTA</h2><p>SANTA is reserved for BOSS MAYSI and SANTA.</p>";return}
 p.innerHTML=`<h2>🤖 SANTA CORE</h2>
 <p>Authority: <span class="badge admin">${esc(profile.role)}</span></p>
 <p class="small">Assistant core is online. This local core handles system commands without exposing an AI API key in the browser.</p>
 <div id="santaLog" class="chatlog"><div class="msg"><b>SANTA:</b> Core online. Awaiting command.</div></div>
 <div class="row"><input id="santaInput" placeholder="Ask SANTA about the system..."><button class="btn" onclick="askSanta()">SEND</button></div>`;
}
window.askSanta=()=>{
 const input=$("santaInput"),log=$("santaLog"),m=input.value.trim();if(!m)return;
 log.innerHTML+=`<div class="msg"><b>YOU:</b> ${esc(m)}</div>`;
 const q=m.toLowerCase();let r="Command received. SANTA Core is ready.";
 if(q.includes("status"))r="All core modules are online: Authentication, Firestore, Chat, Reports, Local Storage and Peer Transfer.";
 else if(q.includes("boss"))r="BOSS MAYSI has BOSS-level administrative access.";
 else if(q.includes("admin"))r="BOSS MAYSI and SANTA have administrative abilities. Normal users do not.";
 else if(q.includes("storage"))r="Files are kept locally by default. Peer transfers use WebRTC and Firestore only for signalling.";
 else if(q.includes("report"))r="Reports are reviewed from the ADMIN module by BOSS MAYSI or SANTA.";
 else if(q.includes("help"))r="Try: status, admin, boss, storage, reports, modules, or birthday.";
 else if(q.includes("birthday"))r="Automatic birthday reveal is configured for 17 November.";
 else if(q.includes("module"))r="Available modules include Library, Storage, Games, Riddles, Quiz, Links, Chat, SANTA and Admin.";
 setTimeout(()=>{log.innerHTML+=`<div class="msg"><b>SANTA:</b> ${esc(r)}</div>`;log.scrollTop=log.scrollHeight},250);input.value="";
}

function renderAdmin(p){
 p.innerHTML=`<h2>ADMIN CONSOLE</h2><p class="small">Available to BOSS MAYSI and SANTA.</p>
 <button class="btn" onclick="showReports()">OPEN REPORTS</button>
 <button class="btn" onclick="loadUsers()">USER DIRECTORY</button>
 <button class="btn" onclick="loadScores()">SCORES</button>
 <div id="adminOut"></div>`;
}
window.showReports=async()=>{
 const out=$("adminOut")||$("panel");
 const s=await getDocs(query(collection(db,"reports"),where("status","==","open"),limit(50)));
 out.innerHTML="<h2>OPEN REPORTS</h2>"+(s.docs.map(d=>{const r=d.data();return`<div class="item danger"><b>${esc(r.reportedName||"Unknown")}</b><p>${esc(r.reason)}</p><button class="btn" onclick="review('${d.id}')">MARK REVIEWED</button><button class="btn" onclick="deleteMessage('${esc(r.messageId)}')">DELETE MESSAGE</button></div>`}).join("")||"<p>No open reports.</p>");
};
window.review=async id=>{try{await updateDoc(doc(db,"reports",id),{status:"reviewed",reviewedBy:auth.currentUser.uid,reviewedAt:serverTimestamp()});showReports()}catch(e){alert(nice(e))}};
window.loadUsers=async()=>{
 const out=$("adminOut")||$("panel"),s=await getDocs(collection(db,"users"));
 out.innerHTML="<h2>USER DIRECTORY</h2>"+s.docs.map(d=>{const u=d.data();return`<div class="item"><b>${esc(u.nickname)}</b><p class="small">@${esc(u.username)} · ${esc(u.role)} · ${u.suspended?"SUSPENDED":"ACTIVE"}</p>${u.role==="USER"?`<button class="btn" onclick="toggleSuspend('${d.id}',${!u.suspended})">${u.suspended?"UNSUSPEND":"SUSPEND"}</button><button class="btn" onclick="deleteProfile('${d.id}')">DELETE PROFILE</button>`:""}</div>`}).join("");
};
window.toggleSuspend=async(uid,state)=>{try{await updateDoc(doc(db,"users",uid),{suspended:state});loadUsers()}catch(e){alert(nice(e))}};
window.deleteProfile=async uid=>{if(!confirm("Delete this profile document? The Firebase Auth account itself cannot be deleted from a browser admin panel."))return;try{await deleteDoc(doc(db,"users",uid));loadUsers()}catch(e){alert(nice(e))}};
window.loadScores=async()=>{
 const out=$("adminOut")||$("panel"),s=await getDocs(query(collection(db,"scores"),orderBy("score","desc"),limit(50)));
 out.innerHTML="<h2>SCORES</h2>"+s.docs.map(d=>{const x=d.data();return`<div class="item"><b>${esc(x.nickname||x.username)}</b> — ${esc(x.game)}: ${Number(x.score)||0}</div>`}).join("")||"<p>No scores.</p>";
};

window.openProfile=()=>{
 $("modalContent").innerHTML=`<h2>PROFILE</h2><p><b>${esc(profile.nickname)}</b></p><p class="small">@${esc(profile.username)} · ${esc(profile.role)}</p><p class="small">Firebase Auth account is active.</p>`;
 $("modal").classList.remove("hidden");
};

window.newRiddle=()=>{const a=[["I speak without a mouth and hear without ears. What am I?","An echo."],["What has keys but cannot open locks?","A keyboard."],["What gets wetter as it dries?","A towel."]];const x=a[Math.floor(Math.random()*a.length)];$("riddleOut").innerHTML=`<div class="item"><b>${x[0]}</b><br><button class="btn" onclick="this.parentElement.insertAdjacentHTML('beforeend','<p class=small>Answer: ${x[1]}</p>')">REVEAL</button></div>`};
window.quiz=()=>{const qs=[["2+2=?","4"],["Which planet is known for its rings?","Saturn"],["What does HTML stand for?","HyperText Markup Language"]];let i=0,score=0;const next=()=>{if(i>=qs.length){$("quizOut").innerHTML=`<div class="item"><b>QUIZ COMPLETE: ${score}/${qs.length}</b></div>`;return}const q=qs[i];$("quizOut").innerHTML=`<div class="item"><b>${q[0]}</b><input id="quizAns" placeholder="Answer"><button class="btn" onclick="answerQuiz()">SUBMIT</button></div>`};window.answerQuiz=()=>{if($("quizAns").value.trim().toLowerCase()===qs[i][1].toLowerCase())score++;i++;next()};next()};

window.memoryGame=()=>{
 const a=["🐱","🐱","🐶","🐶","🦊","🦊","🐼","🐼"].sort(()=>Math.random()-.5);
 $("modalContent").innerHTML="<h2>CAT MEMORY ARENA</h2><div id='grid' style='display:grid;grid-template-columns:repeat(4,1fr);gap:8px'></div>";
 $("modal").classList.remove("hidden");let first=null,lock=false,done=0;
 a.forEach(x=>{const b=document.createElement("button");b.className="btn";b.style.height="70px";b.textContent="❓";b.onclick=()=>{if(lock||b.dataset.done)return;b.textContent=x;if(!first){first={b,x};return}if(first.x===x){first.b.dataset.done="1";b.dataset.done="1";first=null;done+=2;if(done===a.length)alert("You cleared the arena!")}else{lock=true;const old=first.b;first=null;setTimeout(()=>{old.textContent="❓";b.textContent="❓";lock=false},600)}};$("grid").appendChild(b)})
};

window.closeModal=()=>$("modal").classList.add("hidden");
window.logout=async()=>{if(stopChat)stopChat();transferCleanup.forEach(x=>x());transferCleanup=[];await signOut(auth)};
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script>
</body>
</html>
