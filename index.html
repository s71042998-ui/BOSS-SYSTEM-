<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOSS SYSTEM</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --red:#b30000;
  --darkred:#650000;
  --white:#eee;
  --gray:#777;
  --line:#292929;
}

body{
  min-height:100vh;
  background:#020202;
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-x:hidden;
}

/* DEATH NOTE INSPIRED BACKGROUND */

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 50% 45%,
    rgba(120,0,0,.12),
    transparent 45%);
  pointer-events:none;
}

/* SCREEN */

.screen{
  width:92%;
  max-width:800px;
  border:1px solid #333;
  background:rgba(5,5,5,.97);
  padding:35px;
  box-shadow:
    0 0 80px rgba(0,0,0,.9),
    0 0 25px rgba(150,0,0,.05);
  position:relative;
  z-index:2;
}

.hidden{
  display:none!important;
}

/* OPENING */

#opening{
  text-align:center;
  animation:fadeIn .8s ease;
}

.note-symbol{
  font-family:Georgia,serif;
  font-size:80px;
  color:#eee;
  text-shadow:
    0 0 10px #fff,
    0 0 30px rgba(255,255,255,.2);
  margin-bottom:10px;
}

.opening-title{
  font-family:Georgia,serif;
  font-size:42px;
  letter-spacing:9px;
  margin-bottom:8px;
}

.opening-sub{
  color:#777;
  letter-spacing:5px;
  font-size:10px;
  margin-bottom:40px;
}

.loading{
  width:100%;
  height:2px;
  background:#181818;
  overflow:hidden;
  margin-bottom:18px;
}

.loading-bar{
  width:0%;
  height:100%;
  background:#aaa;
  animation:load 3s forwards;
}

.boot-text{
  font-family:monospace;
  color:#777;
  font-size:12px;
  line-height:2;
}

.red{
  color:#b30000;
}

.ok{
  color:#8aff8a;
}

/* TITLE */

.title{
  font-family:Georgia,serif;
  font-size:31px;
  letter-spacing:7px;
  margin-bottom:8px;
}

.subtitle{
  color:#666;
  font-size:10px;
  letter-spacing:4px;
  margin-bottom:35px;
}

/* BUTTONS */

button{
  width:100%;
  padding:15px;
  background:#080808;
  color:#eee;
  border:1px solid #444;
  cursor:pointer;
  letter-spacing:3px;
  transition:.25s;
  margin-top:8px;
}

button:hover{
  background:#eee;
  color:#000;
  border-color:#eee;
}

.red-button{
  border-color:#650000;
}

.red-button:hover{
  background:#8d0000;
  color:#fff;
  border-color:#8d0000;
}

/* INPUTS */

input{
  width:100%;
  padding:15px;
  background:#101010;
  border:1px solid #444;
  color:white;
  outline:none;
  margin:10px 0 16px;
}

input:focus{
  border-color:#aaa;
  box-shadow:0 0 10px rgba(255,255,255,.04);
}

label{
  display:block;
  color:#777;
  font-size:10px;
  letter-spacing:2px;
  margin-top:12px;
}

/* CHOICE */

.choice{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.choice button{
  min-height:90px;
}

.choice-icon{
  display:block;
  font-size:25px;
  margin-bottom:8px;
}

/* WELCOME */

.welcome{
  color:#aaa;
  font-family:monospace;
  margin-bottom:25px;
  padding:12px;
  border-left:2px solid #650000;
  background:#090909;
}

/* MODULES */

.modules{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.module{
  min-height:105px;
  padding:22px 10px;
  border:1px solid #252525;
  background:#0b0b0b;
  color:#aaa;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.module:hover{
  border-color:#777;
  color:#fff;
  transform:translateY(-2px);
  box-shadow:0 0 15px rgba(150,0,0,.08);
}

.icon{
  display:block;
  font-size:25px;
  margin-bottom:10px;
}

/* SANTA */

.santa{
  margin-top:22px;
  padding:18px;
  border-left:2px solid #777;
  background:#0b0b0b;
}

.santa strong{
  font-family:monospace;
  letter-spacing:2px;
}

.santa p{
  margin-top:10px;
  color:#aaa;
  line-height:1.6;
}

/* ROLE BADGE */

.role{
  display:inline-block;
  padding:6px 10px;
  border:1px solid #444;
  color:#aaa;
  font-family:monospace;
  font-size:10px;
  letter-spacing:2px;
  margin-bottom:20px;
}

.admin{
  color:#ff5555;
  border-color:#650000;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:10;
}

.modal-box{
  width:100%;
  max-width:620px;
  background:#090909;
  border:1px solid #333;
  padding:30px;
  box-shadow:0 0 50px rgba(0,0,0,.9);
  animation:modalIn .25s ease;
}

.modal-title{
  font-family:Georgia,serif;
  letter-spacing:4px;
  margin-bottom:20px;
}

.modal-text{
  color:#999;
  line-height:1.7;
  margin-bottom:25px;
}

/* CHAT */

.chat-box{
  height:240px;
  overflow-y:auto;
  background:#050505;
  border:1px solid #222;
  padding:15px;
  margin-bottom:15px;
  font-family:monospace;
}

.chat-message{
  margin-bottom:12px;
  line-height:1.5;
}

.chat-user{
  color:#eee;
}

.chat-santa{
  color:#aaa;
}

/* FOOTER */

.footer{
  margin-top:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#444;
  font-size:9px;
  letter-spacing:2px;
}

.logout{
  width:auto;
  padding:8px 15px;
  margin:0;
  font-size:9px;
}

/* ANIMATIONS */

@keyframes load{
  from{width:0%}
  to{width:100%}
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:scale(.97);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(15px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* MOBILE */

@media(max-width:600px){

  .screen{
    padding:25px 18px;
  }

  .opening-title{
    font-size:28px;
    letter-spacing:5px;
  }

  .title{
    font-size:22px;
    letter-spacing:4px;
  }

  .choice{
    grid-template-columns:1fr;
  }

  .modules{
    grid-template-columns:1fr 1fr;
  }

  .module{
    min-height:90px;
  }
}
</style>
</head>

<body>


<!-- ======================================
     OPENING ANIMATION
====================================== -->

<div class="screen" id="opening">

  <div class="note-symbol">☠</div>

  <div class="opening-title">
    BOSS SYSTEM
  </div>

  <div class="opening-sub">
    THE DIGITAL NOTEBOOK
  </div>

  <div class="loading">
    <div class="loading-bar"></div>
  </div>

  <div class="boot-text" id="bootText">
    INITIALIZING...
  </div>

</div>


<!-- ======================================
     LOGIN / SIGNUP CHOICE
====================================== -->

<div class="screen hidden" id="access">

  <div class="title">
    ACCESS
  </div>

  <div class="subtitle">
    IDENTIFICATION REQUIRED
  </div>

  <div class="choice">

    <button onclick="showLogin()">
      <span class="choice-icon">◉</span>
      LOG IN
    </button>

    <button onclick="showSignup()">
      <span class="choice-icon">✎</span>
      SIGN UP
    </button>

  </div>

</div>


<!-- ======================================
     LOGIN
====================================== -->

<div class="screen hidden" id="login">

  <div class="title">
    LOG IN
  </div>

  <div class="subtitle">
    EXISTING IDENTITY
  </div>

  <label>
    USERNAME / NICKNAME
  </label>

  <input
    id="loginUser"
    type="text"
    placeholder="Enter username or nickname"
    autocomplete="off"
  >

  <label>
    PASSWORD
  </label>

  <input
    id="loginPassword"
    type="password"
    placeholder="Enter password"
  >

  <button onclick="login()">
    ENTER SYSTEM
  </button>

  <button onclick="backToAccess()">
    BACK
  </button>

</div>


<!-- ======================================
     SIGN UP
====================================== -->

<div class="screen hidden" id="signup">

  <div class="title">
    SIGN UP
  </div>

  <div class="subtitle">
    CREATE NEW IDENTITY
  </div>

  <label>
    USERNAME
  </label>

  <input
    id="signupUsername"
    type="text"
    placeholder="Choose a username"
    autocomplete="off"
  >

  <label>
    NICKNAME
  </label>

  <input
    id="signupNickname"
    type="text"
    placeholder="Choose a nickname"
    autocomplete="off"
  >

  <label>
    PASSWORD
  </label>

  <input
    id="signupPassword"
    type="password"
    placeholder="Create a password"
  >

  <label>
    CONFIRM PASSWORD
  </label>

  <input
    id="signupConfirm"
    type="password"
    placeholder="Confirm password"
  >

  <button onclick="signup()">
    CREATE ACCOUNT
  </button>

  <button onclick="backToAccess()">
    BACK
  </button>

</div>


<!-- ======================================
     DASHBOARD
====================================== -->

<div class="screen hidden" id="dashboard">

  <div class="title">
    CONTROL PANEL
  </div>

  <div class="subtitle">
    SYSTEM ONLINE
  </div>

  <div id="roleBadge" class="role">
    USER ACCESS
  </div>

  <div class="welcome" id="welcomeText"></div>

  <div class="modules">

    <div class="module" onclick="openModule('LIBRARY')">
      <span class="icon">📚</span>
      LIBRARY
    </div>

    <div class="module" onclick="openModule('STORAGE')">
      <span class="icon">💾</span>
      STORAGE
    </div>

    <div class="module" onclick="openModule('GAMES')">
      <span class="icon">🎮</span>
      GAMES
    </div>

    <div class="module" onclick="openModule('RIDDLES')">
      <span class="icon">🧠</span>
      RIDDLES
    </div>

    <div class="module" onclick="openModule('QUIZ')">
      <span class="icon">📝</span>
      QUIZ
    </div>

    <div class="module" onclick="openModule('LINKS')">
      <span class="icon">🔗</span>
      LINKS
    </div>

    <div class="module" onclick="openModule('CHAT')">
      <span class="icon">💬</span>
      CHAT
    </div>

    <div class="module" onclick="openModule('SANTA')">
      <span class="icon">🤖</span>
      SANTA
    </div>

  </div>

  <div class="santa">

    <strong>
      🤖 SANTA — ONLINE ●
    </strong>

    <p id="santaMessage"></p>

  </div>

  <div class="footer">

    <span id="systemStatus">
      SYSTEM STATUS: ONLINE
    </span>

    <button
      class="logout"
      onclick="logout()">
      LOG OUT
    </button>

  </div>

</div>


<!-- ======================================
     MODAL
====================================== -->

<div class="modal hidden" id="modal">

  <div class="modal-box">

    <div class="modal-title" id="modalTitle"></div>

    <div class="modal-text" id="modalText"></div>

    <div id="extraContent"></div>

    <button
      class="close"
      onclick="closeModule()">
      RETURN
    </button>

  </div>

</div>


<script>

/* ======================================
   ADMIN ACCOUNTS
======================================

   BOSS MAYSI and SANTA cannot be created
   through normal registration.
====================================== */

const ADMIN_ACCOUNTS = {

  "maysi":{
    username:"maysi",
    nickname:"BOSS MAYSI",
    password:"mai.mai7707",
    role:"BOSS"
  },

  "santa":{
    username:"santa",
    nickname:"SANTA",
    password:"2212201115nanami",
    role:"SANTA"
  }

};


/* ======================================
   OPENING ANIMATION
====================================== */

const bootLines = [
  "CONNECTING TO PRIVATE NETWORK...",
  "SCANNING ACCESS POINT...",
  "LOADING DIGITAL NOTEBOOK...",
  "CHECKING SECURITY...",
  "SANTA CORE: ONLINE",
  "BOSS PROTOCOL: READY",
  "ACCESS TERMINAL: READY"
];

let bootIndex = 0;

function bootAnimation(){

  const bootText =
    document.getElementById("bootText");

  const interval =
    setInterval(() => {

      if(bootIndex >= bootLines.length){

        clearInterval(interval);

        setTimeout(() => {

          document
            .getElementById("opening")
            .classList.add("hidden");

          document
            .getElementById("access")
            .classList.remove("hidden");

        },500);

        return;
      }

      bootText.innerHTML =
        bootLines[bootIndex];

      bootIndex++;

    },450);

}

window.onload = bootAnimation;


/* ======================================
   SCREEN CONTROL
====================================== */

function hideAllScreens(){

  document
    .querySelectorAll(".screen")
    .forEach(screen => {

      screen.classList.add("hidden");

    });

}


function showLogin(){

  hideAllScreens();

  document
    .getElementById("login")
    .classList.remove("hidden");

}


function showSignup(){

  hideAllScreens();

  document
    .getElementById("signup")
    .classList.remove("hidden");

}


function backToAccess(){

  hideAllScreens();

  document
    .getElementById("access")
    .classList.remove("hidden");

}


/* ======================================
   ACCOUNT STORAGE
====================================== */

function getAccounts(){

  return JSON.parse(
    localStorage.getItem("bossSystemAccounts")
  ) || [];

}


function saveAccounts(accounts){

  localStorage.setItem(
    "bossSystemAccounts",
    JSON.stringify(accounts)
  );

}


/* ======================================
   SIGN UP
====================================== */

function signup(){

  const username =
    document
      .getElementById("signupUsername")
      .value
      .trim();

  const nickname =
    document
      .getElementById("signupNickname")
      .value
      .trim();

  const password =
    document
      .getElementById("signupPassword")
      .value;

  const confirm =
    document
      .getElementById("signupConfirm")
      .value;


  if(!username || !nickname || !password){

    alert("ALL FIELDS ARE REQUIRED.");

    return;

  }


  if(password !== confirm){

    alert("PASSWORDS DO NOT MATCH.");

    return;

  }


  if(password.length < 4){

    alert("PASSWORD MUST CONTAIN AT LEAST 4 CHARACTERS.");

    return;

  }


  const accounts = getAccounts();

  const usernameTaken =
    accounts.some(
      account =>
        account.username.toLowerCase()
        === username.toLowerCase()
    );


  if(usernameTaken){

    alert("USERNAME ALREADY EXISTS.");

    return;

  }


  /* Prevent users from creating admin identities */

  if(
    username.toLowerCase() === "maysi" ||
    username.toLowerCase() === "santa" ||
    nickname.toLowerCase() === "boss maysi" ||
    nickname.toLowerCase() === "santa"
  ){

    alert("THAT IDENTITY IS RESERVED.");

    return;

  }


  accounts.push({

    username:username,
    nickname:nickname,
    password:password,
    role:"USER"

  });


  saveAccounts(accounts);


  alert(
    "ACCOUNT CREATED.\n\n" +
    "WELCOME TO THE SYSTEM, " +
    nickname.toUpperCase() +
    "."
  );


  document
    .getElementById("signupUsername")
    .value="";

  document
    .getElementById("signupNickname")
    .value="";

  document
    .getElementById("signupPassword")
    .value="";

  document
    .getElementById("signupConfirm")
    .value="";


  showLogin();

}


/* ======================================
   LOGIN
====================================== */

function login(){

  const identity =
    document
      .getElementById("loginUser")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  if(!identity || !password){

    alert("IDENTITY AND PASSWORD REQUIRED.");

    return;

  }


  /* Check ADMIN accounts first */

  let account = null;


  for(const key in ADMIN_ACCOUNTS){

    const admin =
      ADMIN_ACCOUNTS[key];

    if(
      (
        admin.username.toLowerCase()
        === identity.toLowerCase()

        ||

        admin.nickname.toLowerCase()
        === identity.toLowerCase()
      )

      &&

      admin.password === password
    ){

      account = admin;

      break;

    }

  }


  /* Check normal accounts */

  if(!account){

    const accounts = getAccounts();

    account =
      accounts.find(
        user =>

          (
            user.username.toLowerCase()
            === identity.toLowerCase()

            ||

            user.nickname.toLowerCase()
            === identity.toLowerCase()
          )

          &&

          user.password === password
      );

  }


  if(!account){

    alert(
      "ACCESS DENIED.\n\n" +
      "INVALID IDENTITY OR PASSWORD."
    );

    return;

  }


  sessionStorage.setItem(
    "bossSystemCurrentUser",
    JSON.stringify(account)
  );


  enterDashboard(account);

}


/* ======================================
   DASHBOARD
====================================== */

function enterDashboard(account){

  hideAllScreens();

  document
    .getElementById("dashboard")
    .classList.remove("hidden");


  document
    .getElementById("welcomeText")
    .innerText =
      "IDENTITY VERIFIED — WELCOME, " +
      account.nickname.toUpperCase() +
      ".";


  const badge =
    document.getElementById("roleBadge");


  if(account.role === "BOSS"){

    badge.innerText =
      "◆ BOSS MAYSI — ADMIN ACCESS";

    badge.classList.add("admin");


  }else if(account.role === "SANTA"){

    badge.innerText =
      "◆ SANTA — ADMIN ACCESS";

    badge.classList.add("admin");


  }else{

    badge.innerText =
      "USER ACCESS";

    badge.classList.remove("admin");

  }


  const santa =
    document.getElementById("santaMessage");


  if(account.role === "BOSS"){

    santa.innerText =
      "Finally. BOSS MAYSI has arrived. Full authority detected. Santa Core is standing by.";

  }

  else if(account.role === "SANTA"){

    santa.innerText =
      "SANTA CORE LOGIN DETECTED. Assistant identity replaced by direct SANTA system access.";

  }

  else{

    santa.innerText =
      "Identity accepted, " +
      account.nickname +
      ". Welcome to the system. Try not to cause chaos. 🤖";

  }

}


/* ======================================
   MODULE SYSTEM
====================================== */

function openModule(module){

  const currentUser =
    JSON.parse(
      sessionStorage.getItem(
        "bossSystemCurrentUser"
      )
    );


  const title =
    document.getElementById("modalTitle");

  const text =
    document.getElementById("modalText");

  const extra =
    document.getElementById("extraContent");


  extra.innerHTML = "";


  title.innerText = module;


  const messages = {

    LIBRARY:
      "LIBRARY INITIALIZED. Notes, images, documents and shared information can be organized here.",

    STORAGE:
      "STORAGE INITIALIZED. File uploads, folders and trash management can be connected here.",

    GAMES:
      "GAME HUB INITIALIZED. CAT MEMORY ARENA will be the first main game.",

    RIDDLES:
      "RIDDLE SYSTEM INITIALIZED. SANTA can provide clues and hints.",

    QUIZ:
      "QUIZ SYSTEM INITIALIZED. Anime, study and gaming categories can be added.",

    LINKS:
      "LINK DATABASE INITIALIZED. Useful websites and resources can be saved here.",

    CHAT:
      "CHAT SYSTEM INITIALIZED. Real-time messaging requires a backend connection.",

    SANTA:
      ""
  };


  if(module === "SANTA"){

    if(
      currentUser &&
      (
        currentUser.role === "BOSS" ||
        currentUser.role === "SANTA"
      )
    ){

      text.innerText =
        "SANTA CORE — DIRECT ACCESS.\n\n" +
        "Personal assistant mode is available from this account.";

      extra.innerHTML = `

        <div class="chat-box" id="chatBox">

          <div class="chat-message chat-santa">
            SANTA: Core online. Awaiting command.
          </div>

        </div>

        <input
          id="chatInput"
          type="text"
          placeholder="Give SANTA a command..."
        >

        <button onclick="sendSantaMessage()">
          SEND COMMAND
        </button>

      `;

    }

    else{

      text.innerText =
        "SANTA is BOSS MAYSI's personal AI assistant. " +
        "Normal users can access the SANTA module, but direct SANTA account privileges require the SANTA identity.";

    }

  }

  else{

    text.innerText =
      messages[module] ||
      "MODULE INITIALIZED.";

  }


  document
    .getElementById("modal")
    .classList.remove("hidden");

}


/* ======================================
   SANTA CHAT
====================================== */

function sendSantaMessage(){

  const input =
    document.getElementById("chatInput");

  const chat =
    document.getElementById("chatBox");


  if(!input || !chat){

    return;

  }


  const message =
    input.value.trim();


  if(!message){

    return;

  }


  chat.innerHTML += `

    <div class="chat-message chat-user">
      YOU: ${escapeHTML(message)}
    </div>

  `;


  let response =
    "Command received. SANTA is ready for the next instruction.";


  const lower =
    message.toLowerCase();


  if(
    lower.includes("hello") ||
    lower.includes("hi")
  ){

    response =
      "SANTA: Hello. System is operating normally.";

  }

  else if(
    lower.includes("status")
  ){

    response =
      "SANTA: All primary systems currently report ONLINE.";

  }

  else if(
    lower.includes("boss")
  ){

    response =
      "SANTA: BOSS MAYSI has administrative authority over this system.";

  }

  else if(
    lower.includes("who are you")
  ){

    response =
      "SANTA: I am the personal assistant core assigned to BOSS MAYSI.";

  }


  setTimeout(() => {

    chat.innerHTML += `

      <div class="chat-message chat-santa">
        ${escapeHTML(response)}
      </div>

    `;

    chat.scrollTop =
      chat.scrollHeight;

  },300);


  input.value="";

}


function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* ======================================
   CLOSE MODULE
====================================== */

function closeModule(){

  document
    .getElementById("modal")
    .classList.add("hidden");

}


/* ======================================
   LOGOUT
====================================== */

function logout(){

  sessionStorage.removeItem(
    "bossSystemCurrentUser"
  );


  document
    .getElementById("loginUser")
    .value="";

  document
    .getElementById("loginPassword")
    .value="";


  hideAllScreens();

  document
    .getElementById("access")
    .classList.remove("hidden");

}


/* ======================================
   ENTER KEY SUPPORT
====================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeModule();

    }

  }
);

</script>

</body>
</html>
