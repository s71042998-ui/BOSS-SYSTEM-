<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOSS SYSTEM</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:Arial,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(520px,100%);background:#0b0b0b;border:1px solid #700;box-shadow:0 0 30px #300;padding:28px}h1,h2{color:#e50914;margin-top:0}.small{color:#999;font-size:13px}input{width:100%;padding:12px;margin:6px 0 12px;background:#111;color:#fff;border:1px solid #333}.btn{border:1px solid #800;background:#180000;color:#fff;padding:10px 15px;margin:4px}.btn:hover{background:#600}.error{color:#ff6666;min-height:20px}header{padding:18px 24px;border-bottom:1px solid #400;display:flex;justify-content:space-between;align-items:center;gap:12px}.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.role-badge{padding:5px 9px;border:1px solid #333;color:#aaa;font-size:12px}.role-badge.admin{border-color:#900;color:#ff6666}.dashboard{max-width:1100px;margin:auto;padding:24px}.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.module{min-height:115px;background:#0b0b0b;border:1px solid #400;padding:20px;color:#fff;text-align:left}.module b{display:block;color:#e50914;margin-bottom:8px}.panel{margin-top:20px;padding:20px;background:#090909;border:1px solid #300}.chatlog{height:280px;overflow:auto;background:#050505;border:1px solid #222;padding:10px}.msg,.user-row,.report-row{padding:10px;border-bottom:1px solid #222;overflow-wrap:anywhere}.msg b{color:#e50914}.row{display:flex;gap:8px;margin-top:8px}.row input{margin:0}.ai-log{height:280px;overflow:auto;border:1px solid #222;padding:10px}.ai-msg{padding:9px;margin:7px 0;background:#0a0a0a}.modal{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.modalbox{width:min(700px,100%);max-height:85vh;overflow:auto;background:#0b0b0b;border:1px solid #900;padding:22px}a{color:#ff7777}@media(max-width:600px){header{flex-direction:column;align-items:stretch}.dashboard{padding:14px}.row{flex-direction:column}}
</style>
</head><body>
<div id="welcome" class="screen"><div class="card"><h1>BOSS SYSTEM</h1><p class="small">Firebase-powered control system.</p><button class="btn" onclick="showAuth('login')">LOGIN</button><button class="btn" onclick="showAuth('signup')">SIGN UP</button></div></div>
<div id="auth" class="screen hidden"><div class="card"><h2 id="authTitle">LOGIN</h2><div id="signupFields" class="hidden"><label>Choose Username</label><input id="username" maxlength="20" placeholder="3–20 characters"><label>Choose Nickname</label><input id="nickname" maxlength="40" placeholder="Your display name"></div><label id="loginLabel">Username</label><input id="loginUsername" maxlength="20" placeholder="Username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><div id="confirmBox" class="hidden"><label>Confirm Password</label><input id="confirmPassword" type="password" autocomplete="new-password"></div><div id="authError" class="error" role="alert"></div><button class="btn" id="authBtn" onclick="submitAuth()">LOGIN</button><button class="btn" onclick="showScreen('welcome')">BACK</button><p class="small">BOSS MAYSI and SANTA are reserved system identities.</p></div></div>
<div id="dashboard" class="hidden"><header><div><b style="color:#e50914">BOSS SYSTEM</b> <span id="identity" class="small"></span></div><div class="header-actions"><span id="roleBadge" class="role-badge">USER ACCESS</span><button class="btn" onclick="logout()">LOGOUT</button></div></header><main class="dashboard"><h2>CONTROL PANEL</h2><div id="modules" class="modules"></div><div id="panel" class="panel"><h2>Welcome</h2><p>Select a module.</p></div></main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div id="modalContent"></div><button class="btn" onclick="closeModal()">CLOSE</button></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,deleteUser}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getFirestore,doc,getDoc,writeBatch,serverTimestamp,collection,addDoc,getDocs,deleteDoc,query,orderBy,onSnapshot,limit,where,updateDoc}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC255XuKEt8JJKbWRjqLEqhxcOn1TXGC2U",authDomain:"boss-system-ddf6c.firebaseapp.com",projectId:"boss-system-ddf6c",storageBucket:"boss-system-ddf6c.firebasestorage.app",messagingSenderId:"67593000613",appId:"1:67593000613:web:b03c162be0e1661b171f4c",measurementId:"G-E6NGWHFJXH"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const AUTH_DOMAIN="boss-system-ddf6c.firebaseapp.com",BOSS_UID="uqhohIvaGCO6YlEjKKSrrVJbv533",SANTA_UID="nEQyREBsdwPSGYoUnqeD6DngECI3";
const $=id=>document.getElementById(id);let mode="login",profile=null,stopChat=null,authVersion=0;
const internalEmail=u=>u.toLowerCase()+"@"+AUTH_DOMAIN;
window.showScreen=id=>{["welcome","auth","dashboard"].forEach(k=>$(k).classList.add("hidden"));$(id).classList.remove("hidden")};
window.showAuth=m=>{mode=m;showScreen("auth");$("authTitle").textContent=m==="login"?"LOGIN":"SIGN UP";$("authBtn").textContent=m==="login"?"LOGIN":"CREATE ACCOUNT";$("signupFields").classList.toggle("hidden",m!=="signup");$("confirmBox").classList.toggle("hidden",m!=="signup");$("loginUsername").classList.toggle("hidden",m==="signup");$("loginLabel").classList.toggle("hidden",m==="signup");$("authError").textContent="";$("password").value="";$("confirmPassword").value="";$("loginUsername").value="";$("username").value="";$("nickname").value=""};
function niceError(e){let c=e?.code||"";if(["invalid-credential","wrong-password","user-not-found"].some(x=>c.includes(x)))return"Invalid username or password.";if(c.includes("email-already-in-use"))return"That username is already registered.";if(c.includes("invalid-email"))return"Invalid username.";if(c.includes("weak-password"))return"Password is too weak.";if(c.includes("permission-denied"))return"Firebase permission denied. Check Firestore Rules.";if(c.includes("operation-not-allowed"))return"Enable Email/Password in Firebase Authentication.";return e?.message||"Something went wrong."}
window.submitAuth=async()=>{const b=$("authBtn");b.disabled=true;$("authError").textContent="";try{let pass=$("password").value;if(!pass)throw Error("Enter your password.");if(mode==="signup"){let username=$("username").value.trim(),nickname=$("nickname").value.trim(),lower=username.toLowerCase();if(!/^[A-Za-z0-9_]{3,20}$/.test(username))throw Error("Username must be 3–20 characters using letters, numbers or underscore.");if(!nickname||nickname.length>40)throw Error("Nickname must be 1–40 characters.");if(pass.length<6)throw Error("Password must be at least 6 characters.");if(pass!==$("confirmPassword").value)throw Error("Passwords do not match.");if(["maysi","santa"].includes(lower))throw Error("That username is reserved.");let reservation=doc(db,"usernames",lower);if((await getDoc(reservation)).exists())throw Error("That username is already taken.");let cred=await createUserWithEmailAndPassword(auth,internalEmail(username),pass);try{let batch=writeBatch(db);batch.set(doc(db,"users",cred.user.uid),{uid:cred.user.uid,username,nickname,usernameLower:lower,role:"USER",createdAt:serverTimestamp()});batch.set(reservation,{uid:cred.user.uid,username,usernameLower:lower,createdAt:serverTimestamp()});await batch.commit()}catch(e){try{await deleteUser(cred.user)}catch(_){}throw Error("Account setup failed while saving Firestore data. Check Rules and Authentication → Users before retrying.")}}else{let username=$("loginUsername").value.trim().toLowerCase();if(!/^[A-Za-z0-9_]{3,20}$/.test(username))throw Error("Enter a valid username.");await signInWithEmailAndPassword(auth,internalEmail(username),pass)}}catch(e){$("authError").textContent=niceError(e)}finally{b.disabled=false}};
function isAdmin(){return !!profile&&["BOSS","SANTA"].includes(profile.role)}
onAuthStateChanged(auth,async user=>{let v=++authVersion;if(!user){profile=null;if(stopChat){stopChat();stopChat=null} $("dashboard").classList.add("hidden");if($("auth").classList.contains("hidden"))showScreen("welcome");return}try{let s=await getDoc(doc(db,"users",user.uid));if(v!==authVersion)return;if(!s.exists())throw Error("Login account exists but its users/{UID} Firestore document is missing.");profile=s.data();if(profile.uid!==user.uid)throw Error("Profile UID does not match this account.");if(user.uid===BOSS_UID&&profile.role!=="BOSS")throw Error("BOSS profile role is incorrect.");if(user.uid===SANTA_UID&&profile.role!=="SANTA")throw Error("SANTA profile role is incorrect.");enterDashboard()}catch(e){$("authError").textContent=niceError(e);try{await signOut(auth)}catch(_){}showScreen("auth")}});
function enterDashboard(){$("welcome").classList.add("hidden");$("auth").classList.add("hidden");$("dashboard").classList.remove("hidden");$("identity").textContent=(profile.nickname||profile.username)+" · "+profile.role;$("roleBadge").textContent=isAdmin()?(profile.role==="BOSS"?"◆ BOSS MAYSI — ADMIN":"◆ SANTA — ADMIN"):"USER ACCESS";$("roleBadge").classList.toggle("admin",isAdmin());renderModules();$("panel").innerHTML="<h2>Welcome</h2><p>Select a module.</p>"}
function renderModules(){let list=[["Library","Personal Firebase notes.","library"],["Storage","Browser-local demo storage.","storage"],["Games","Games room.","games"],["Riddles","Riddle room.","riddles"],["Quiz","Quiz room.","quiz"],["Links","Save useful links.","links"],["Chat","Shared chat.","chat"],["SANTA","SANTA command console.","santa"]];if(isAdmin())list.push(["ADMIN","Users and reports.","admin"]);$("modules").replaceChildren();list.forEach(([t,d,k])=>{let b=document.createElement("button");b.className="module";let title=document.createElement("b");title.textContent=t;let desc=document.createElement("span");desc.className="small";desc.textContent=d;b.append(title,desc);b.onclick=()=>openModule(k);$("modules").append(b)})}
window.openModule=async k=>{let p=$("panel");if(stopChat){stopChat();stopChat=null}try{if(k==="library"){p.innerHTML='<h2>LIBRARY</h2><input id="noteTitle" maxlength="100" placeholder="Note title"><input id="noteBody" maxlength="2000" placeholder="Note body"><button class="btn" id="saveNote">SAVE NOTE</button><div id="notesList"></div>';$("saveNote").onclick=saveNote;await loadNotes()}else if(k==="storage"){p.innerHTML='<h2>STORAGE</h2><p>Small data stays in this browser; cloud uploads are disabled.</p><button class="btn" id="storeTest">SAVE TEST</button><button class="btn" id="readTest">READ TEST</button><p id="storageResult"></p>';$("storeTest").onclick=()=>{localStorage.setItem("boss_demo","Saved");$("storageResult").textContent="Saved in this browser."};$("readTest").onclick=()=>$("storageResult").textContent=localStorage.getItem("boss_demo")||"Nothing saved"}else if(k==="games"){p.innerHTML='<h2>GAMES</h2><button class="btn" id="memory">CAT MEMORY ARENA</button>';$("memory").onclick=memoryGame}else if(k==="riddles")p.innerHTML="<h2>RIDDLES</h2><p>Riddle room ready for the next build.</p>";else if(k==="quiz")p.innerHTML="<h2>QUIZ</h2><p>Quiz room ready for the next build.</p>";else if(k==="links"){p.innerHTML='<h2>LINKS</h2><input id="linkLabel" maxlength="100" placeholder="Label"><input id="linkUrl" maxlength="2000" placeholder="https://example.com"><button class="btn" id="saveLink">SAVE LINK</button><div id="linksList"></div>';$("saveLink").onclick=saveLink;await loadLinks()}else if(k==="chat"){p.innerHTML='<h2>CHAT</h2><div id="chatLog" class="chatlog">Loading...</div><div class="row"><input id="chatInput" maxlength="1000" placeholder="Message"><button class="btn" id="sendChat">SEND</button></div>';$("sendChat").onclick=sendChat;$("chatInput").onkeydown=e=>{if(e.key==="Enter")sendChat()};startChat()}else if(k==="santa")renderSanta();else if(k==="admin")await renderAdmin()}catch(e){p.innerHTML='<h2>MODULE ERROR</h2><p class="error">'+esc(niceError(e))+'</p>'}};
async function saveNote(){try{let title=$("noteTitle").value.trim(),body=$("noteBody").value.trim();if(!title||!body)return alert("Enter title and body.");await addDoc(collection(db,"users",auth.currentUser.uid,"notes"),{title,body,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});await loadNotes()}catch(e){alert(niceError(e))}}
async function loadNotes(){let s=await getDocs(collection(db,"users",auth.currentUser.uid,"notes"));$("notesList").replaceChildren();if(s.empty){$("notesList").textContent="No notes yet.";return}s.forEach(d=>{let n=d.data(),box=document.createElement("div");box.className="panel";let title=document.createElement("b");title.textContent=n.title;let body=document.createElement("p");body.textContent=n.body;let del=document.createElement("button");del.className="btn";del.textContent="DELETE";del.onclick=async()=>{try{await deleteDoc(doc(db,"users",auth.currentUser.uid,"notes",d.id));await loadNotes()}catch(e){alert(niceError(e))}};box.append(title,body,del);$("notesList").append(box)})}
async function saveLink(){try{let label=$("linkLabel").value.trim(),url=$("linkUrl").value.trim();if(!label||!/^https?:\/\//i.test(url))return alert("Enter a label and valid http/https URL.");await addDoc(collection(db,"users",auth.currentUser.uid,"links"),{label,url:new URL(url).href,createdAt:serverTimestamp()});await loadLinks()}catch(e){alert(niceError(e))}}
async function loadLinks(){let s=await getDocs(collection(db,"users",auth.currentUser.uid,"links"));$("linksList").replaceChildren();if(s.empty){$("linksList").textContent="No links yet.";return}s.forEach(d=>{let x=d.data(),box=document.createElement("div");box.className="panel";let a=document.createElement("a");a.href=x.url;a.textContent=x.label+" — "+x.url;a.target="_blank";a.rel="noopener noreferrer";let del=document.createElement("button");del.className="btn";del.textContent="DELETE";del.onclick=async()=>{try{await deleteDoc(doc(db,"users",auth.currentUser.uid,"links",d.id));await loadLinks()}catch(e){alert(niceError(e))}};box.append(a,del);$("linksList").append(box)})}
function startChat(){let q=query(collection(db,"chatMessages"),orderBy("createdAt","asc"),limit(100));stopChat=onSnapshot(q,s=>{let box=$("chatLog");if(!box)return;box.replaceChildren();if(s.empty){box.textContent="No messages yet.";return}s.forEach(d=>{let m=d.data(),row=document.createElement("div");row.className="msg";let name=document.createElement("b");name.textContent=m.nickname||m.username||"User";row.append(name,document.createTextNode(": "+(m.text||"")));let report=document.createElement("button");report.className="btn";report.textContent="REPORT";report.onclick=()=>reportMessage(d.id,m.uid,m.nickname||m.username||"User");row.append(report);if(isAdmin()){let del=document.createElement("button");del.className="btn";del.textContent="DELETE";del.onclick=()=>deleteChat(d.id);row.append(del)}box.append(row)});box.scrollTop=box.scrollHeight},e=>{$("chatLog").textContent=niceError(e)})}
async function sendChat(){let text=$("chatInput").value.trim();if(!text)return;try{await addDoc(collection(db,"chatMessages"),{uid:auth.currentUser.uid,username:profile.username,nickname:profile.nickname,text:text.slice(0,1000),createdAt:serverTimestamp()});$("chatInput").value=""}catch(e){alert(niceError(e))}}
async function reportMessage(messageId,reportedUid,reportedName){let reason=prompt("Reason for report?");if(!reason||!reason.trim())return;try{await addDoc(collection(db,"reports"),{messageId,reportedUid,reportedName,reporterUid:auth.currentUser.uid,reason:reason.trim().slice(0,500),status:"open",createdAt:serverTimestamp()});alert("Report submitted.")}catch(e){alert(niceError(e))}}
async function deleteChat(id){if(!isAdmin()||!confirm("Delete this message?"))return;try{await deleteDoc(doc(db,"chatMessages",id))}catch(e){alert(niceError(e))}}
function renderSanta(){if(!isAdmin())return $("panel").innerHTML="<h2>SANTA</h2><p>Access denied.</p>";$("panel").innerHTML='<h2>SANTA CORE</h2><p class="small">This is a local command-response engine, not a connected generative AI service.</p><div id="santaLog" class="ai-log">SANTA: Core online.</div><div class="row"><input id="santaInput" maxlength="500" placeholder="/help or ask a basic question"><button class="btn" id="santaSend">SEND</button></div><button class="btn" data-cmd="/help">/help</button><button class="btn" data-cmd="/status">/status</button><button class="btn" data-cmd="/whoami">/whoami</button><button class="btn" data-cmd="/users">/users</button><button class="btn" data-cmd="/reports">/reports</button><button class="btn" data-cmd="/birthday">/birthday</button>';$("santaSend").onclick=sendSanta;$("santaInput").onkeydown=e=>{if(e.key==="Enter")sendSanta()};document.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>{$("santaInput").value=b.dataset.cmd;sendSanta()})}
async function sendSanta(){let m=$("santaInput").value.trim(),out=$("santaLog");if(!m||!isAdmin())return;$("santaInput").value="";let reply="Try /help, /status, /whoami, /users, /reports or /birthday.";try{let l=m.toLowerCase();if(l==="/help")reply="Commands: /help, /status, /whoami, /users, /reports, /birthday.";else if(l==="/status")reply="Signed in to Firebase. Access depends on deployed Firestore Rules.";else if(l==="/whoami")reply=profile.nickname+" · "+profile.role;else if(l==="/users")reply="Profile count: "+(await getDocs(collection(db,"users"))).size;else if(l==="/reports")reply="Open reports: "+(await getDocs(query(collection(db,"reports"),where("status","==","open"),limit(50)))).size;else if(l==="/birthday")reply="Birthday reveal target: November 17.";else if(l.includes("who are you"))reply="I am SANTA, the local assistant console. This version is not connected to an AI model."}catch(e){reply=niceError(e)}out.textContent+="\nYOU: "+m+"\nSANTA: "+reply}
async function renderAdmin(){if(!isAdmin())return $("panel").innerHTML="<h2>ADMIN</h2><p>Access denied.</p>";$("panel").innerHTML='<h2>ADMIN CONTROL</h2><h3>USER DIRECTORY</h3><div id="directory">Loading...</div><h3>OPEN REPORTS</h3><div id="reports">Loading...</div>';let [users,reports]=await Promise.all([getDocs(collection(db,"users")),getDocs(query(collection(db,"reports"),where("status","==","open"),limit(50)))]);$("directory").replaceChildren();users.forEach(d=>{let u=d.data(),x=document.createElement("div");x.className="user-row";x.textContent=(u.nickname||u.username||"User")+" · @"+(u.username||"")+" · "+(u.role||"USER");$("directory").append(x)});$("reports").replaceChildren();if(reports.empty)$("reports").textContent="No open reports.";reports.forEach(d=>{let r=d.data(),x=document.createElement("div");x.className="report-row";let text=document.createElement("p");text.textContent=(r.reportedName||"Unknown")+": "+(r.reason||"");let b=document.createElement("button");b.className="btn";b.textContent="MARK REVIEWED";b.onclick=async()=>{try{await updateDoc(doc(db,"reports",d.id),{status:"reviewed",reviewedBy:auth.currentUser.uid,reviewedAt:serverTimestamp()});await renderAdmin()}catch(e){alert(niceError(e))}};x.append(text,b);$("reports").append(x)})}
function memoryGame(){let cards=["🐱","🐱","🐶","🐶","🦊","🦊","🐼","🐼"].sort(()=>Math.random()-.5);$("modalContent").innerHTML='<h2>CAT MEMORY ARENA</h2><div id="grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>';$("modal").classList.remove("hidden");let first=null,lock=false,done=0;cards.forEach(emoji=>{let b=document.createElement("button");b.className="btn";b.style.height="70px";b.textContent="❓";b.onclick=()=>{if(lock||b.dataset.done)return;b.textContent=emoji;if(!first){first={b,emoji};return}if(first.emoji===emoji){first.b.dataset.done=b.dataset.done="1";first=null;done+=2;if(done===cards.length)alert("You cleared CAT MEMORY ARENA!")}else{lock=true;let old=first.b;first=null;setTimeout(()=>{old.textContent=b.textContent="❓";lock=false},600)}};$("grid").append(b)})}
window.memoryGame=memoryGame;window.closeModal=()=>$("modal").classList.add("hidden");window.logout=async()=>{if(stopChat){stopChat();stopChat=null}await signOut(auth)};
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script></body></html>
